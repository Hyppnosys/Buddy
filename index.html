<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- O <link rel="manifest"> é injetado automaticamente pelo vite-plugin-pwa
         (veja vite.config.ts) — não precisa de um aqui. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Buddy — um app de rotina, foco e bem-estar com sessões de foco, diário, respiração e um mascote que evolui com você." />
    <meta name="theme-color" content="#3F6B58" />
    <!-- iOS não segue o manifest.json pra "instalar na tela de início" — precisa dessas tags específicas. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Buddy" />
    <title>Buddy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
